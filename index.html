<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Networks Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
/* Single light theme on purpose: mirrors the white "Networking Fundamentals" deck.
   Layout: module rail on the left, one stage (diagram + caption) per step, Back/Next below. */
:root{
  --ink:#24292e; --muted:#6a7178; --line:#d6dade; --panel:#f4f6f7; --bg:#ffffff;
  --blue:#00b0f0; --blue-ink:#0079a8; --green:#00b050; --green-ink:#00803a;
  --yellow:#ffc000; --red:#e0352b;
  --display:"Figtree","Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100%}
.rail{border-right:1px solid var(--line);padding:24px 16px;background:var(--panel)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;margin:0 8px 4px}
.brand span{color:var(--muted);font-weight:600}
.tag{color:var(--muted);font-size:14px;margin:0 8px 20px}
.mods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.mods button{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;width:100%;padding:8px;border-radius:8px;font-size:15px;color:var(--ink);box-sizing:border-box}
.mods button:hover{background:#e8ecee}
.mods button:focus-visible,.btn:focus-visible,.bit:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mods .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#fff;border:1.5px solid var(--line);color:var(--muted)}
.mods button[aria-current="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:700}
.mods button[aria-current="true"] .n{background:var(--blue);border-color:var(--blue);color:#fff}
.mods button.done .n{background:var(--green);border-color:var(--green);color:#fff}
main{padding:28px 40px 32px;display:flex;flex-direction:column;gap:18px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:34px;margin:0;line-height:1.1;text-wrap:balance}
h1 .soft{color:var(--muted)}
.count{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.stage{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;min-height:330px;display:flex;align-items:center;justify-content:center;overflow-x:auto}
.stage svg{width:100%;max-width:860px;height:auto;display:block}
.cap{max-width:72ch}
.cap h2{font-family:var(--display);font-size:24px;margin:0 0 6px;line-height:1.2;text-wrap:balance}
.cap p{margin:0 0 8px}
.cap em{font-style:italic;font-weight:800}
.cap .aside{color:var(--muted);font-size:15px}
.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;padding:10px 20px;border-radius:999px;font-weight:700;font-size:16px;border:1.5px solid var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.35;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}
.dots i.seen{background:#9fdcf3}
.hint{color:var(--muted);font-size:13px}
/* html scenes */
.hero{text-align:center}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,76px);line-height:1.05;color:#3b3f44;letter-spacing:.5px}
.hero .rule{height:1px;background:var(--line);margin:14px auto 16px;max-width:640px}
.hero .sub{font-weight:800;font-size:clamp(20px,3vw,30px)}
.hero .lines{color:var(--muted);font-weight:600;font-size:18px;margin-top:6px}
.b{color:var(--blue)} .g{color:var(--green-ink)} .k{color:var(--ink)}
table.t{border-collapse:collapse;font-size:16px;margin:0 auto;font-variant-numeric:tabular-nums}
table.t th{background:#111;color:#fff;padding:8px 16px;font-weight:800}
table.t td{border:1px solid #222;padding:7px 16px;text-align:center}
table.t td:first-child{font-weight:800}
.tcp{color:var(--green-ink);font-weight:800}.udp{color:var(--blue-ink);font-weight:800}
.wid{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.bits{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bitc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bit{all:unset;cursor:pointer;width:54px;height:64px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-size:30px;font-weight:800;background:#fff;box-sizing:border-box}
.bit[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.readout{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;font-size:18px}
.readout b{font-size:30px;display:block;font-family:var(--display);font-variant-numeric:tabular-nums}
.calc{display:grid;gap:12px;width:100%;max-width:720px}
.calc .row{display:flex;gap:16px;flex-wrap:wrap;align-items:end}
.calc label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:600}
.calc input[type=text]{font:inherit;font-size:20px;font-weight:800;padding:6px 10px;border:2px solid var(--ink);border-radius:8px;width:190px}
.calc input[type=range]{width:220px;accent-color:var(--blue)}
.bin{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;overflow-x:auto;white-space:nowrap;padding:10px;background:var(--panel);border-radius:8px}
.bin .n{color:var(--blue-ink);font-weight:700}.bin .h{color:var(--green-ink);font-weight:700}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.res div{background:var(--panel);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted)}
.res b{display:block;color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
.err{color:var(--red);font-weight:700;min-height:1.4em;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;width:100%;max-width:820px}
.card{border:1.5px solid var(--line);border-radius:12px;padding:14px}
.card .lbl{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.card .v{font-family:var(--display);font-weight:800;font-size:22px}
.card p{margin:6px 0 0;font-size:15px;color:var(--muted)}
code.term{display:block;background:#1e2226;color:#e8eaec;border-radius:8px;padding:12px 14px;font-size:14px;white-space:pre;overflow-x:auto;text-align:left;max-width:100%}
.quiz{width:100%;max-width:780px;display:flex;flex-direction:column;gap:12px;align-self:flex-start}
.score{font-weight:800;color:var(--blue-ink);font-variant-numeric:tabular-nums}
.q{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.qq{font-weight:800;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:600;box-sizing:border-box}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt[disabled]{cursor:default;color:var(--muted)}
.opt.ok{background:#e3f7ea;border-color:var(--green);color:var(--green-ink)}
.opt.no{background:#fde8e6;border-color:var(--red);color:var(--red)}
.opt.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
.fb{margin-top:8px;font-size:15px}
.red{color:var(--red)}
.q.sort{display:grid;grid-template-columns:minmax(160px,1fr) auto;align-items:center;gap:6px 14px}
.q.sort .qq{margin:0;font-variant-numeric:tabular-nums}
.q.sort .fb{grid-column:1/-1;margin:0}
.hosts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:10px}
.frame{font-size:18px;margin-bottom:12px;padding:10px 12px;background:#fff8e0;border-radius:8px}
table.t.mt{margin:0}
table.t tr.new td{background:#fff3cc}
.hdr{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.hf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700;border:1.5px solid #2a7fb0;border-radius:8px;padding:8px}
.hf select{font:inherit;font-size:15px;font-weight:700;color:var(--ink);padding:4px;border:1px solid var(--line);border-radius:6px;background:#fff}
.hf select:focus-visible{outline:3px solid var(--blue)}
.hf b{font-size:15px;color:var(--ink)}
.hf.okf{border-color:var(--green);background:#e3f7ea}.hf.nof{border-color:var(--red);background:#fde8e6}
.hf.fixed{border-style:dashed;border-color:var(--line)}
.chal{font-size:16px;text-align:center}
.chal .btn{padding:6px 14px;font-size:14px;margin-left:8px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:14px 16px}
  .tag{display:none}
  .mods{flex-direction:row;overflow-x:auto;gap:4px}
  .mods button{grid-template-columns:26px;padding:6px}
  .mods .lab{display:none}
  main{padding:18px 16px}
  h1{font-size:26px}
  .dots{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Modules">
    <div class="brand">How Networks <span>Work</span></div>
    <p class="tag">What happens when you open Instagram, one click at a time.</p>
    <ul class="mods" id="mods"></ul>
  </nav>
  <main>
    <div class="top">
      <h1 id="title"></h1>
      <div class="count" id="count" aria-live="polite"></div>
    </div>
    <section class="stage" id="stage" aria-live="polite"></section>
    <div class="cap" id="cap"></div>
    <div class="nav">
      <button class="btn" id="prev" type="button">Back</button>
      <button class="btn primary" id="next" type="button">Next</button>
      <span class="hint">Tip: use the ← → keys to present</span>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>
  </main>
</div>
<script>
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = {ink:'#24292e',muted:'#6a7178',line:'#c7ccd1',blue:'#00b0f0',green:'#00b050',yellow:'#ffc000',red:'#e0352b',panel:'#f4f6f7',orange:'#ff8a00',gink:'#00803a',bink:'#0079a8'};

/* ---------- SVG helpers ---------- */
const svg = (inner, w=860, h=360, label='diagram') =>
  `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" font-family="Figtree, Avenir Next, Segoe UI, sans-serif">
   <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${C.muted}"/></marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f55"/></marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
   </defs>${inner}</svg>`;
const T = (x,y,s,o={}) => `<text x="${x}" y="${y}" font-size="${o.size||15}" font-weight="${o.w||700}" fill="${o.fill||C.ink}" text-anchor="${o.a||'middle'}" ${o.italic?'font-style="italic"':''}>${s}</text>`;
const L = (x1,y1,x2,y2,o={}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||C.line}" stroke-width="${o.sw||2.5}" ${o.dash?'stroke-dasharray="6 6"':''} ${o.arrow?'marker-end="url(#ah)"':''}/>`;
function laptop(x,y,w,fill,lines=[],o={}){
  const h=Math.round(w*.62), tc = o.tc || (fill==='#fff'?C.ink:'#fff');
  let s=`<g opacity="${o.dim?0.3:1}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${fill}" stroke="#2b2f33" stroke-width="5"/>
  <path d="M${x-14},${y+h+3} h${w+28} l-9,11 h${-(w+10)} z" fill="#c9ced3"/>`;
  const fs=o.fs||Math.max(12,Math.min(16,w/9)), y0=y+h/2-(lines.length-1)*fs*0.62+fs*0.35;
  lines.forEach((ln,i)=>{s+=T(x+w/2,y0+i*fs*1.25,ln,{size:fs,w:i===0?800:600,fill:tc})});
  return s+'</g>';
}
function sw(cx,cy,s=70,o={}){
  const x=cx-s/2,y=cy-s/2,a=s*.32,g=s*.04;
  const R=(yy)=>`<line x1="${cx-g}" y1="${yy}" x2="${cx+a}" y2="${yy}" stroke="#4a4f55" stroke-width="5" marker-end="url(#ahd)"/>`;
  const Lf=(yy)=>`<line x1="${cx+g}" y1="${yy}" x2="${cx-a}" y2="${yy}" stroke="#4a4f55" stroke-width="5" marker-end="url(#ahd)"/>`;
  return `<g opacity="${o.dim?0.3:1}"><rect x="${x}" y="${y}" width="${s}" height="${s}" rx="12" fill="#fff" stroke="${o.hl?C.blue:'#2b2f33'}" stroke-width="${o.hl?4:2.5}"/>
  ${R(cy-s*.24)}${Lf(cy-s*.08)}${R(cy+s*.08)}${Lf(cy+s*.24)}
  ${o.label?T(cx,cy+s/2+20,o.label,{size:14}):''}</g>`;
}
function rt(cx,cy,r=34,o={}){
  const d=r*.62;
  return `<g opacity="${o.dim?0.3:1}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.green}" stroke="${o.hl?C.ink:'none'}" stroke-width="4"/>
  <line x1="${cx}" y1="${cy-6}" x2="${cx}" y2="${cy-d}" stroke="#fff" stroke-width="5" marker-end="url(#ahw)"/>
  <line x1="${cx}" y1="${cy+6}" x2="${cx}" y2="${cy+d}" stroke="#fff" stroke-width="5" marker-end="url(#ahw)"/>
  <line x1="${cx-d}" y1="${cy}" x2="${cx-8}" y2="${cy}" stroke="#fff" stroke-width="5" marker-end="url(#ahw)"/>
  <line x1="${cx+d}" y1="${cy}" x2="${cx+8}" y2="${cy}" stroke="#fff" stroke-width="5" marker-end="url(#ahw)"/>
  ${o.label?T(cx,cy+r+20,o.label,{size:14}):''}</g>`;
}
function server(x,y,w,h,fill,lines=[],o={}){
  let s=`<g opacity="${o.dim?0.3:1}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" stroke="${o.hl?C.ink:'none'}" stroke-width="3"/>`;
  for(let i=0;i<3;i++) s+=`<rect x="${x+12}" y="${y+12+i*12}" width="${w-24}" height="7" rx="3.5" fill="#fff"/>`;
  lines.forEach((ln,i)=>{s+=T(x+w/2,y+h-14-(lines.length-1-i)*18,ln,{size:14,w:i===0?800:600,fill:'#fff'})});
  return s+'</g>';
}
function dot(x1,y1,x2,y2,o={}){
  const c=o.c||C.yellow, dur=o.dur||1.6, n=o.n||1;
  if(RM) return `<circle cx="${(x1+x2)/2}" cy="${(y1+y2)/2}" r="9" fill="${c}" stroke="#b38600" stroke-width="1.5"/>`;
  let s='';
  for(let i=0;i<n;i++) s+=`<circle r="9" fill="${c}" stroke="${c===C.yellow?'#b38600':'#fff'}" stroke-width="1.5" opacity="0"><animateMotion dur="${dur}s" begin="${(o.delay||0)+i*dur/n}s" repeatCount="indefinite" path="M${x1},${y1} L${x2},${y2}"/><animate attributeName="opacity" dur="${dur}s" begin="${(o.delay||0)+i*dur/n}s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.1;.85;1"/></circle>`;
  return s;
}
function bubble(x,y,w,lines,o={}){
  const h=16+lines.length*21, c=o.c||C.ink;
  let s=`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#fff" stroke="${c}" stroke-width="2.5"/>`;
  if(o.tail) s+=`<path d="M${o.tail[0]-8},${y+(o.tail[1]>y?h:0)} L${o.tail[0]},${o.tail[1]} L${o.tail[0]+8},${y+(o.tail[1]>y?h:0)}" fill="#fff" stroke="${c}" stroke-width="2.5"/><rect x="${o.tail[0]-9}" y="${(o.tail[1]>y?y+h-3:y+1)}" width="18" height="4" fill="#fff"/>`;
  lines.forEach((ln,i)=>{s+=T(x+w/2,y+27+i*21,ln,{size:15,w:i===0?800:600,fill:i===0?c:C.ink})});
  return s+'</g>';
}
function strip(x,y,cw,cells){ // packet header
  let s='';
  cells.forEach((c,i)=>{
    const fill=c.fill||(c.hl?'#fff3cc':'#fff');
    s+=`<rect x="${x+i*cw}" y="${y}" width="${cw}" height="56" fill="${fill}" stroke="${c.hl?'#d9a300':'#2a7fb0'}" stroke-width="${c.hl?3:1.5}"/>`;
    s+=T(x+i*cw+cw/2,y+21,c.k,{size:12,w:600,fill:c.kc||C.muted});
    s+=T(x+i*cw+cw/2,y+43,c.v,{size:15,w:800,fill:c.vc||C.ink});
  });
  return s;
}
const hero=(big,sub,lines=[])=>`<div class="hero"><div class="big">${big}</div><div class="rule"></div><div class="sub">${sub}</div>${lines.map(l=>`<div class="lines">${l}</div>`).join('')}</div>`;

/* ---------- reusable scenes ---------- */
function journey(active){ // active: which highlight
  const y=170, P={lap:[20,y-45],s1:[235,y],r1:[370,y],r2:[505,y],s2:[640,y]};
  const on=k=>!active||active.includes(k)||!active.some(z=>z!=='path');
  let s='';
  s+=L(150,y,200,y)+L(270,y,336,y)+L(404,y,471,y)+L(539,y,605,y)+L(675,y,730,y);
  if(active&&active.includes('path')) s+=dot(150,y,730,y,{dur:3,n:3});
  s+=laptop(20,y-45,130,C.blue,['You','10.1.5.8'],{dim:!on('lap')});
  s+=sw(235,y,64,{label:'Switch',dim:!on('s1'),hl:active&&active.includes('s1')});
  s+=rt(370,y,32,{label:'Router 1',dim:!on('r1')});
  s+=rt(505,y,32,{label:'Router 2',dim:!on('r2')});
  s+=sw(640,y,64,{label:'Switch',dim:!on('s2')});
  s+=server(730,y-62,100,124,C.green,['Instagram','3.218.3.143'],{dim:!on('ig')});
  return s;
}
function arpScene(step){
  const S={x:400,y:72}, L3=[{x:70,c:C.blue,n:'Blue',ip:'10.1.1.5',mac:'…BA:C6',p:1},{x:330,c:C.green,n:'Green',ip:'10.1.1.6',mac:'…A6:FD',p:2},{x:590,c:C.orange,n:'Orange',ip:'10.1.1.7',mac:'…55:29',p:3}];
  let s='';
  const top=l=>[l.x+80,232], from=[S.x,S.y+36];
  L3.forEach(l=>{const t=top(l); s+=L(from[0],from[1],t[0],t[1]); s+=T(from[0]+(t[0]-from[0])*.22+(t[0]<from[0]?-14:t[0]>from[0]?14:12),from[1]+(t[1]-from[1])*.22,'Port '+l.p,{size:13,w:700,fill:C.muted})});
  const D=(l,up,c)=>{const t=top(l);return up?dot(t[0],t[1],from[0],from[1],{c}):dot(from[0],from[1],t[0],t[1],{c})};
  if(step===1) s+=D(L3[0],true);
  if(step===3){s+=D(L3[1],false);s+=D(L3[2],false)}
  if(step===5) s+=D(L3[1],true,C.green);
  if(step===7) s+=D(L3[0],false,C.green);
  if(step===8) {s+=D(L3[0],true,C.blue);s+=D(L3[1],false,C.blue)}
  s+=sw(S.x,S.y,72,{hl:[2,6,7].includes(step)});
  L3.forEach(l=>{
    const dim = step===4 && l.n!=='Orange' ? false : false;
    s+=laptop(l.x,232,160,l.c,[l.n,l.ip,'MAC '+l.mac],{fs:14,dim:(step===4&&l.n!=='Orange')});
  });
  // speech
  if(step===1||step===3) s+=bubble(40,92,230,['ARP broadcast','"Who is 10.1.1.6?"'],{c:C.blue});
  if(step===4) s+=bubble(580,120,200,['Orange','"Not me. Ignored."'],{c:C.orange});
  if(step===5||step===7) s+=bubble(530,92,260,['Green replies','"10.1.1.6 is me: …A6:FD"'],{c:C.gink});
  // MAC table

function castScene(mode){ // unicast / broadcast / multicast

function hop(n){
  // n: 0 intro, 1 laptop->R1, 2 R1->R2 (NAT), 3 R2->Instagram, 4 reply
  let s=journey(['lap','s1','r1','r2','s2','ig']);
  const segs={1:[150,402-66],2:[402,537-64],3:[537,730],4:[730,150]};
  if(n>=1&&n<=3) s+=dot(segs[n][0],170,segs[n][1],170,{dur:1.6,n:2});
  if(n===4) s+=dot(730,170,150,170,{dur:3,n:3,c:C.green});
  const H={
    0:['?','?','3.218.3.143','10.1.5.8','443','53874'],
    1:['Router 1','You','3.218.3.143','10.1.5.8','443','53874'],
    2:['Router 2','Router 1','3.218.3.143','203.0.113.10','443','53874'],
    3:['Instagram','Router 2','3.218.3.143','203.0.113.10','443','53874'],
    4:['Router 2','Instagram','203.0.113.10','3.218.3.143','53874','443']};
  const prev=H[n-1]||H[n], cur=H[n];
  const ks=['Destination MAC','Source MAC','Destination IP','Source IP','Destination Port','Source Port'];
  s+=strip(25,10,135,cur.map((v,i)=>({k:ks[i],v,hl:n>0&&n<4&&v!==prev[i]})));
  s+=T(430,92,'↑ Header on the packet right now (yellow = changed at this hop)',{size:13,w:600,fill:C.muted});
  return svg(s,860,300,'Packet journey hop '+n);
}

 {h:'Meet the switch', p:'Inside a building, devices connect to a <em>switch</em>. It learns which device (MAC) is on which of its ports, and sends data only where it needs to go. But first, Blue only knows Green\'s <em>IP</em>, not its MAC…', sc:()=>arpScene(0)},

function bitWidget(){
  const v=[128,64,32,16,8,4,2,1];
  return `<div class="wid"><div class="bits">${v.map((n,i)=>`<div class="bitc"><button class="bit" type="button" aria-pressed="false" data-v="${n}" id="bit${i}" aria-label="Bit worth ${n}">0</button>${n}</div>`).join('')}</div>
  <div class="readout"><div>Binary<b id="bbin">00000000</b></div><div>Number<b id="bdec">0</b></div><div>Letter<b id="bchr">–</b></div></div><div class="chal" id="chal" aria-live="polite"></div></div>`;
}
const CH=[[65,'the letter A','That is how a capital A travels on the wire.'],[10,'the first number of 10.x.x.x','Private addresses start with this.'],[192,'a common mask value','Two bits on: 128 + 64.'],[255,'all bits on','The biggest number a byte can hold.']]; let CHI=0;
function bindBits(){
  const btns=[...document.querySelectorAll('.bit')];
  const upd=()=>{let d=0,b='';btns.forEach(x=>{const on=x.getAttribute('aria-pressed')==='true';x.textContent=on?'1':'0';b+=on?'1':'0';if(on)d+=+x.dataset.v});
    document.getElementById('bbin').textContent=b;document.getElementById('bdec').textContent=d;
    document.getElementById('bchr').textContent=d>=33&&d<=126?String.fromCharCode(d):(d===32?'space':'–');
    const c=CH[CHI%CH.length], ch=document.getElementById('chal');
    ch.innerHTML = d===c[0] ? `<b class="g">✓ ${c[0]} = ${b}.</b> ${c[2]}<button type="button" class="btn" id="chn">Next challenge</button>` : `Challenge: make <b>${c[0]}</b> (${c[1]})`;
    const n=document.getElementById('chn'); if(n) n.addEventListener('click',()=>{CHI++;btns.forEach(z=>z.setAttribute('aria-pressed','false'));upd()});};
  btns.forEach(x=>x.addEventListener('click',()=>{x.setAttribute('aria-pressed',x.getAttribute('aria-pressed')==='true'?'false':'true');upd()}));
  upd();
}
function calcWidget(){
  return `<div class="calc"><div class="row"><label for="cip">IP address<input type="text" id="cip" value="10.1.47.5" inputmode="decimal" autocomplete="off"></label>
  <label for="cpre">Mask: <span id="cpl">/19</span><input type="range" id="cpre" min="8" max="30" value="19"></label></div>
  <div class="err" id="cerr" aria-live="polite"></div>
  <div class="bin" id="cbin"></div>
  <div class="res" id="cres"></div></div>`;
}
function bindCalc(){
  const ip=document.getElementById('cip'), pre=document.getElementById('cpre');
  const toS=n=>[24,16,8,0].map(s=>(n>>>s)&255).join('.');
  const run=()=>{
    const p=+pre.value; document.getElementById('cpl').textContent='/'+p;
    const parts=ip.value.trim().split('.');
    const ok=parts.length===4&&parts.every(x=>/^\d{1,3}$/.test(x)&&+x<=255);
    const err=document.getElementById('cerr');
    if(!ok){err.textContent='Enter four numbers from 0 to 255, separated by dots (e.g. 10.1.47.5).';return}
    err.textContent='';
    const n=parts.reduce((a,x)=>((a<<8)>>>0)+ +x,0)>>>0;
    const mask=p===0?0:(0xFFFFFFFF<<(32-p))>>>0, net=(n&mask)>>>0, bc=(net|(~mask>>>0))>>>0;
    const bits=n.toString(2).padStart(32,'0');
    let html='';for(let i=0;i<32;i++){if(i&&i%8===0)html+=' . ';html+=`<span class="${i<p?'n':'h'}">${bits[i]}</span>`}
    document.getElementById('cbin').innerHTML=html;
    const R=[['Subnet',toS(net)+'/'+p],['Mask',toS(mask)],['First device',toS(net+1)],['Last device',toS(bc-1)],['Broadcast',toS(bc)],['Usable devices',(Math.pow(2,32-p)-2).toLocaleString()]];
    document.getElementById('cres').innerHTML=R.map(r=>`<div>${r[0]}<b>${r[1]}</b></div>`).join('');
  };
  ip.addEventListener('input',run); pre.addEventListener('input',run); run();
}

      return `<button type="button" class="opt ${cls}" data-q="${i}" data-o="${j}" ${ans?'disabled':''}>${o}</button>`}).join('')}</div>
      <div class="fb">${st[i]!==undefined?(st[i]===q.a?'<b class="g">Correct.</b> ':'<b class="red">Not quite.</b> ')+q.e:''}</div></div>`).join('')+

    const st=SS[id]||(SS[id]={});
    const done=Object.keys(st).length, right=items.filter((it,i)=>st[i]===it.c).length;
    return `<div class="quiz"><div class="score">${done===items.length?`You got ${right} / ${items.length}`:`${done} of ${items.length} sorted`}</div>`+
    items.map((it,i)=>{const ans=st[i]!==undefined;return `<div class="q sort"><div class="qq">${it.t}</div><div class="opts">${cats.map((c,j)=>`<button type="button" class="opt ${ans?(j===it.c?'ok':(j===st[i]?'no':'')):''}" data-i="${i}" data-c="${j}" ${ans?'disabled':''}>${c}</button>`).join('')}</div>${ans?`<div class="fb">${st[i]===it.c?'<b class="g">Yes.</b> ':'<b class="red">No.</b> '}${it.e}</div>`:''}</div>`}).join('')+
    (done===items.length?`<button type="button" class="btn" id="sreset">Try again</button>`:'')+`</div>`;
  }, after:()=>{
    document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{SS[id][+b.dataset.i]=+b.dataset.c;rerender()}));
    const r=document.getElementById('sreset'); if(r) r.addEventListener('click',()=>{SS[id]={};rerender()});
  }};
}

/* be the switch */
const BTS={i:0,ans:null};
const FRAMES=[
 {inP:1,from:'A',to:'C',ok:3,why:'The table is empty, so the switch does not know where C is: it floods the frame out of every other port. It also learns: A is on Port 1.'},
 {inP:3,from:'C',to:'A',ok:0,why:'A is already in the table (Port 1), so the frame goes only there. The switch learns: C is on Port 3.'},
 {inP:2,from:'B',to:'Everyone (broadcast)',ok:3,why:'Broadcasts always go out of every other port. The switch learns: B is on Port 2.'},
 {inP:1,from:'A',to:'C',ok:2,why:'C is known on Port 3, so only Port 3 gets it. No flooding this time.'},
 {inP:3,from:'C',to:'B',ok:1,why:'B is known on Port 2. The switch has now learned everyone.'}];
const tableAfter=i=>{const t={};FRAMES.slice(0,i).forEach(f=>{t[f.from]=f.inP});return t};
function switchStep(){
  return {h:'Exercise: be the switch', p:'Frames arrive one by one. Using only your MAC table, decide where each frame goes. Remember: the switch learns from the <em>source</em> MAC.', quiz:true, sc:()=>{
    if(BTS.i>=FRAMES.length) return `<div class="quiz"><div class="score">Done! You forwarded ${BTS.score||0} / ${FRAMES.length} frames correctly.</div><div class="q"><div class="qq">Final MAC table</div>${macTable(tableAfter(FRAMES.length),null)}</div><button type="button" class="btn" id="bsreset">Play again</button></div>`;
    const f=FRAMES[BTS.i], answered=BTS.ans!==null, tb=tableAfter(BTS.i+(answered?1:0));
    const opts=['Port 1','Port 2','Port 3','All other ports (flood)'];
    return `<div class="quiz"><div class="score">Frame ${BTS.i+1} of ${FRAMES.length}</div>
    <div class="q">
    <div class="frame">Frame arrives on <b>Port ${f.inP}</b>: from <b class="b">${f.from}</b> to <b class="g">${f.to}</b></div>
    <div class="qq">Your MAC table ${answered?'(updated)':'right now'}</div>${macTable(tb,answered?f.from:null)}
    <div class="qq" style="margin-top:12px">Where do you send it?</div>
    <div class="opts">${opts.map((o,j)=>`<button type="button" class="opt ${answered?(j===f.ok?'ok':(j===BTS.ans?'no':'')):''}" data-j="${j}" ${answered||j+1===f.inP?'disabled':''}>${o}</button>`).join('')}</div>
    ${answered?`<div class="fb">${BTS.ans===f.ok?'<b class="g">Correct.</b> ':'<b class="red">Not quite.</b> '}${f.why}</div><button type="button" class="btn primary" id="bsnext">Next frame</button>`:''}</div></div>`;
  }, after:()=>{
    document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{BTS.ans=+b.dataset.j;if(BTS.ans===FRAMES[BTS.i].ok)BTS.score=(BTS.score||0)+1;rerender()}));
    const n=document.getElementById('bsnext'); if(n) n.addEventListener('click',()=>{BTS.i++;BTS.ans=null;rerender()});
    const r=document.getElementById('bsreset'); if(r) r.addEventListener('click',()=>{BTS.i=0;BTS.ans=null;BTS.score=0;rerender()});
  }};
}
function macTable(t,hl){
  const rows=Object.entries(t);
  return `<table class="t mt"><tr><th>Port</th><th>MAC</th></tr>${rows.length?rows.map(([m,p])=>`<tr class="${m===hl?'new':''}"><td>Port ${p}</td><td>${m}</td></tr>`).join(''):'<tr><td colspan="2" style="font-weight:600;color:#6a7178">empty</td></tr>'}</table>`;
}

/* build the header */
const BH={hop:1,v:{},checked:false};
const HOPS={1:{dm:'Router 1',sm:'You',di:'3.218.3.143',si:'10.1.5.8',why:'Hop 1 goes from your laptop to its gateway, Router 1. Your private IP is still the source.'},
 2:{dm:'Router 2',sm:'Router 1',di:'3.218.3.143',si:'203.0.113.10',why:'Router 1 rewrites the MACs for the next hand-off and does NAT: the source IP becomes its public address.'},
 3:{dm:'Instagram',sm:'Router 2',di:'3.218.3.143',si:'203.0.113.10',why:'New MACs again; the IPs stay the same as hop 2.'}};
function headerStep(){
  const F=[['dm','Destination MAC',['You','Router 1','Router 2','Instagram']],['sm','Source MAC',['You','Router 1','Router 2','Instagram']],['di','Destination IP',['10.1.5.8','203.0.113.10','3.218.3.143']],['si','Source IP',['10.1.5.8','203.0.113.10','3.218.3.143']]];
  return {h:'Exercise: build the header', p:'Fill in the labels the packet carries on each hop to Instagram. Tip: MACs point to the <em>next hop</em>, IPs point to the <em>final destination</em>. Router 1 does NAT.', quiz:true, sc:()=>{
    const ans=HOPS[BH.hop]; let ok=0;
    const cells=F.map(([k,lab,opts])=>{const v=BH.v[k]||'', good=v===ans[k]; if(good)ok++;
      return `<label class="hf ${BH.checked?(good?'okf':'nof'):''}" for="h-${k}">${lab}<select id="h-${k}" data-k="${k}"><option value="">Choose…</option>${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></label>`}).join('');
    return `<div class="quiz"><div class="opts">${[1,2,3].map(h=>`<button type="button" class="opt hopb ${BH.hop===h?'cur':''}" data-h="${h}">Hop ${h}</button>`).join('')}</div>
    <div class="q"><div class="qq">${['','You → Router 1','Router 1 → Router 2','Router 2 → Instagram'][BH.hop]}</div>
    <div class="hdr">${cells}<div class="hf fixed">Destination Port<b>443</b></div><div class="hf fixed">Source Port<b>53874</b></div></div>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button type="button" class="btn primary" id="hcheck">Check</button>${BH.checked&&ok<4?'<button type="button" class="btn" id="hshow">Show answer</button>':''}</div>
    ${BH.checked?`<div class="fb">${ok===4?'<b class="g">All four correct.</b> ':`<b class="red">${ok} of 4 correct.</b> `}${ok===4?ans.why:'Red fields need another look.'}</div>`:''}</div></div>`;
  }, after:()=>{
    document.querySelectorAll('.hdr select').forEach(s=>s.addEventListener('change',()=>{BH.v[s.dataset.k]=s.value;BH.checked=false;rerender(false)}));
    document.querySelectorAll('.hopb').forEach(b=>b.addEventListener('click',()=>{BH.hop=+b.dataset.h;BH.v={};BH.checked=false;rerender()}));
    document.getElementById('hcheck').addEventListener('click',()=>{BH.checked=true;rerender()});
    const s=document.getElementById('hshow'); if(s) s.addEventListener('click',()=>{const a=HOPS[BH.hop];BH.v={dm:a.dm,sm:a.sm,di:a.di,si:a.si};BH.checked=true;rerender()});
  }};
}

/* insert exercises, then a quiz at the end of every module */
MODS[4].steps.splice(5,0,sorterStep('pp','Exercise: private or public?','Sort each address. Watch out for the 172 range: only 172.16 to 172.31 is private.',['Private','Public'],[
 {t:'192.168.1.20',c:0,e:'192.168.x.x is private (home routers love it).'},
 {t:'8.8.8.8',c:1,e:'Public: it is Google\'s DNS server.'},
 {t:'10.20.30.40',c:0,e:'Anything starting with 10 is private.'},
 {t:'172.20.5.1',c:0,e:'172.20 is inside 172.16 – 172.31, so private.'},
 {t:'172.40.5.1',c:1,e:'172.40 is outside 172.16 – 172.31, so public.'},
 {t:'3.218.3.143',c:1,e:'Public: that is Instagram.'}]));
MODS[5].steps.splice(5,0,sorterStep('tu','Exercise: TCP or UDP?','For each activity, would you pick the careful courier (TCP) or the fast talker (UDP)?',['TCP','UDP'],[
 {t:'Downloading a file',c:0,e:'Every byte matters, so TCP.'},
 {t:'The audio in a Webex call',c:1,e:'Real time: a late packet is useless, so UDP.'},
 {t:'Sending an email',c:0,e:'It must arrive complete, so TCP.'},
 {t:'A DNS lookup',c:1,e:'One tiny question and answer: UDP (port 53) is quicker.'},
 {t:'Player movements in an online game',c:1,e:'Old positions are useless, so UDP.'},
 {t:'Loading a web page over HTTPS',c:0,e:'Classic TCP 443 (HTTP/3 can use UDP, but TCP is the standard answer).'}]));
MODS[6].steps.push(switchStep());
MODS[7].steps.push(sorterStep('l23','Exercise: switch or router?','Does the data stay in the same subnet (the switch delivers it, layer 2) or does it need the router (layer 3)?',['Switch (same subnet)','Router (different subnet)'],[
 {t:'10.1.5.8 /24 → 10.1.5.200',c:0,e:'Both in 10.1.5.0/24.'},
 {t:'10.1.5.8 /24 → 10.1.6.8',c:1,e:'10.1.5 vs 10.1.6: different subnets.'},
 {t:'192.168.1.10 /24 → 192.168.1.254',c:0,e:'Both in 192.168.1.0/24.'},
 {t:'10.1.5.8 /16 → 10.1.9.4',c:0,e:'With /16 only the first two numbers count: both are 10.1.'},
 {t:'10.1.5.8 /24 → 3.218.3.143 (Instagram)',c:1,e:'Anything on the internet goes through the gateway.'},
 {t:'10.1.47.5 /19 → 10.1.70.1',c:1,e:'10.1.47.5/19 covers 10.1.32.0 to 10.1.63.255 (try it in the calculator).'}]));
MODS[9].steps.splice(9,0,headerStep());
MODS.forEach((md,i)=>md.steps.push(quizStep(i)));

function rerender(){const y=window.scrollY;render();window.scrollTo(0,y)}
/* ---------- engine ---------- */
let m=0,s=0; const seen=new Set();
const el=id=>document.getElementById(id);
function navList(){
  el('mods').innerHTML=MODS.map((md,i)=>`<li><button type="button" data-m="${i}" aria-current="${i===m}" class="${modDone(i)&&i!==m?'done':''}"><span class="n">${i+1}</span><span class="lab">${md.t} ${md.soft}</span></button></li>`).join('');
  el('mods').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.m,0)));
}
const modDone=i=>MODS[i].steps.every((_,j)=>seen.has(i+'-'+j));
function render(){
  const md=MODS[m], st=md.steps[s];
  seen.add(m+'-'+s);
  el('title').innerHTML=`${md.t} <span class="soft">${md.soft}</span>`;
  el('count').textContent=`Module ${m+1} of ${MODS.length} · Step ${s+1} of ${md.steps.length}`;
  el('stage').innerHTML=st.sc();
  el('cap').innerHTML=`<h2>${st.h}</h2><p>${st.p}</p>${st.aside?`<p class="aside">${st.aside}</p>`:''}`;
  if(st.after) st.after();
  el('prev').disabled = m===0&&s===0;
  const last = m===MODS.length-1&&s===md.steps.length-1;
  el('next').disabled = last;
  el('next').textContent = s===md.steps.length-1&&!last ? 'Next module' : 'Next';
  el('dots').innerHTML=md.steps.map((_,j)=>`<i class="${j===s?'on':seen.has(m+'-'+j)?'seen':''}"></i>`).join('');
  navList();
  const h='m'+(m+1)+'-s'+(s+1); if(location.hash!=='#'+h){try{history.replaceState(null,'','#'+h)}catch(e){}}
}
function go(mi,si){m=mi;s=si;render();}
function next(){const md=MODS[m]; if(s<md.steps.length-1) s++; else if(m<MODS.length-1){m++;s=0} render();}
function prev(){ if(s>0) s--; else if(m>0){m--;s=MODS[m].steps.length-1} render();}
el('next').addEventListener('click',next); el('prev').addEventListener('click',prev);
document.addEventListener('keydown',e=>{ if(e.target.matches('input'))return; if(e.key==='ArrowRight'){next()} if(e.key==='ArrowLeft'){prev()} });
function fromHash(){const r=/^#m(\d+)-s(\d+)$/.exec(location.hash||'');if(r){const a=+r[1]-1,b=+r[2]-1;if(MODS[a]&&MODS[a].steps[b]){m=a;s=b}}}
window.addEventListener('hashchange',()=>{fromHash();render()});
fromHash(); render();
</script>
</body>
